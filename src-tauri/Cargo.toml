[package]
name = "slopculator"
version = "0.1.0-alpha.1"
license = "MIT"
description = "Slopculator: calculator and grapher for Algebra 2"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
