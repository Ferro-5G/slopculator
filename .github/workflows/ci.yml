name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      e2e:
        description: 'Run the browser E2E suite'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks only on automatic runs (~1–2 min) to stay well under the Actions quota; browser E2E runs locally via
  # `npm run verify` or on demand via workflow_dispatch.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      # The mobile app is a directory a checkout may not have. Where it is, the unit tests include its tests.
      - if: hashFiles('mobile/package-lock.json') != ''
        run: npm ci --prefix mobile
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - if: hashFiles('mobile/package-lock.json') != ''
        run: npm run typecheck --prefix mobile
      - if: github.event_name == 'workflow_dispatch' && inputs.e2e
        name: Browser E2E
        run: npm run e2e
      - if: failure() && github.event_name == 'workflow_dispatch' && inputs.e2e
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: e2e-shots
          path: .shots/
          if-no-files-found: ignore
