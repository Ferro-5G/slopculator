name: Release

on:
  push:
    tags: ['v*']

# Only the job that publishes to the release may write to the repository.
permissions:
  contents: read

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Through the environment, not pasted into the script: a tag name may hold characters the shell reads as code.
      - run: cp dist/index.html "slopculator-$REF_NAME.html"
        env:
          REF_NAME: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            slopculator-${{ github.ref_name }}.html
