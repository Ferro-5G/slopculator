      <main style="max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif">
        <h1>Slopculator: calculator and grapher</h1>
        <p>Slopculator is a free calculator you type into, one line at a time. Each answer appears beside its line, and anything with an x is drawn on the graph. It needs JavaScript to run.</p>
        <h2>What it does</h2>
        <ul>
          <li><strong>Exact answers.</strong> 0.1 + 0.2 is 3/10, sin(30°) is 1/2, and 2^64 keeps every digit.</li>
          <li><strong>Graphs with sliders.</strong> y = a(x − 1)^2 − 3 gets a slider for a. Zeros, extrema and intersections are marked.</li>
          <li><strong>Statistics and probability.</strong> normalcdf, invNorm, zscore, binompdf, t, χ² and F distributions, regressions, and a shaded normal curve.</li>
          <li><strong>Matrices and vectors.</strong> det, inverse, transpose and products, with an editor for typing them.</li>
          <li><strong>Calculus and algebra.</strong> Derivatives, integrals, sums, and solve(2^x = 10, x).</li>
          <li><strong>Units and engineering.</strong> convert(5, "mi", "km"), plus moist-air, duct and refrigerant functions for HVAC.</li>
        </ul>
        <h2>Typing math</h2>
        <p>Write it the way you would on paper: 2x, 3(4 + 5), sqrt 16, sin 30, |x|, 5!, 10% of 50, x². Missing closing brackets are filled in. Ctrl+K (⌘K on a Mac) finds any function by name or by what it does.</p>
      </main>
